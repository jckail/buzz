name: Admin Web
on:
  push:
    branches: [main]
    paths: ["admin-web/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", ".github/workflows/admin-web.yml"]
  pull_request:
    paths: ["admin-web/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", ".github/workflows/admin-web.yml"]
permissions:
  contents: read
concurrency:
  group: admin-web-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  admin-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Install locked admin dependencies
        run: pnpm install --frozen-lockfile --filter buzz-admin-web
      - name: Admin lint and format
        run: cd admin-web && biome check src
      - name: Admin types
        run: pnpm -C admin-web typecheck
      - name: Admin focused tests
        run: pnpm -C admin-web exec vitest run src --maxWorkers=2
      - name: Admin build
        run: pnpm -C admin-web build
